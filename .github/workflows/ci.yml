name: CI - Storefront (FS-Public)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-lint:
    name: Build & Lint (FS-Public)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run Lint
        run: npm run lint
      - name: Run Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://feryshop.up.railway.app"
          NEXTAUTH_SECRET: "ci-build-only-placeholder-not-used-at-runtime"
